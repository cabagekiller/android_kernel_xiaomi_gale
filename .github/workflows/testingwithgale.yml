name: Kernel Build (gale) - SUSFS + KSU NEXT | clang-r547379

on:
  pull_request:
  workflow_dispatch:
    inputs:
      BUILD_TITLE:
        description: 'Custom Build Title'
        required: false
      KERNEL_TREE:
        description: 'Kernel Tree'
        default: 'https://github.com/cabagekiller/android_kernel_xiaomi_gale'
        required: true
      KERNEL_TREE_BRANCH:
        description: 'Kernel Tree Branch'
        required: true
        default: 'dev/android-4.19-stable'
      CODENAME:
        description: 'Phone Codename'
        default: 'gale'
        required: true
      ANYKERNEL_URL:
        description: 'AnyKernel Url (leave blank if you dont want AnyKernel)'
        default: 'https://github.com/DjSenseii1/f4aosp'
        required: false
      ANYKERNEL_BRANCH:
        description: 'AnyKernel Branch (defaults to codename)'
        default: 'main'
        required: false
      SECOND_ANYKERNEL_URL:
        description: 'Second AnyKernel Url (leave blank if you dont want AnyKernel)'
        default: 'https://github.com/DjSenseii1/miui-hyperF4'
        required: false
      SECOND_ANYKERNEL_BRANCH:
        description: 'Second AnyKernel Branch (defaults to codename)'
        default: 'main'
        required: false
      UPLOAD_TO_RELEASE:
        description: 'Upload to release'
        type: boolean
        default: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Display User Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Custom Build Title: ${{ github.event.inputs.BUILD_TITLE }}"
        echo "Kernel Tree: ${{ github.event.inputs.KERNEL_TREE }}/tree/${{ github.event.inputs.KERNEL_TREE_BRANCH }}"
        echo "Codename: ${{ github.event.inputs.CODENAME }}"
        echo "AnyKernel Url: ${{ github.event.inputs.ANYKERNEL_URL }}/tree/${{ github.event.inputs.ANYKERNEL_BRANCH }}"
        echo "Second AnyKernel Url: ${{ github.event.inputs.SECOND_ANYKERNEL_URL }}/tree/${{ github.event.inputs.SECOND_ANYKERNEL_BRANCH }}"
        echo "::endgroup::"

    - name: Initialize workspace and tools
      id: workspace
      run: |
        set -e # Exit immediately on error
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
        echo "build_title=${{ github.event.inputs.BUILD_TITLE || github.event.inputs.CODENAME }}" >> $GITHUB_OUTPUT

        sudo apt-get update -y -qq # Run update only once
        sudo apt-get install -y --no-install-recommends \
          python3-pip \
          git \
          zip \
          unzip \
          gcc \
          g++ \
          make \
          ninja-build \
          file \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          wget \
          build-essential \
          python3-dev \
          python3-setuptools \
          rsync \
          ccache \
          llvm-dev

        sudo apt install flex libncurses6 # Install dependencies for kernel build
        echo "tools-folder=$(pwd)" >> $GITHUB_OUTPUT

    - name: Cache Clang
      uses: actions/cache@v4
      id: cache-clang
      with:
        path: workspace/clang
        key: clang-r547379-ubuntu-latest # Unique key for clang r547379 on ubuntu-latest
        restore-keys: |
          clang-r547379-ubuntu-latest
          clang-r547379-

    - name: Download and Extract Clang
      if: steps.cache-clang.outputs.cache-hit != 'true'
      working-directory: ${{ steps.workspace.outputs.workspace-folder }}
      run: |
        set -e
        echo "Downloading and extracting clang..."
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
        mkdir clang
        tar -xf clang.tar.gz -C clang
        echo "Clang downloaded and extracted."

    - name: Free disk space (optional - consider removing if not needed)
      if: false # Set to 'true' to enable if you suspect disk space issues
      run: |
          df -h # Check disk space
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost-build # Example cleanup - adjust as needed
          df -h # Check disk space again

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: 2G

    - name: Clone kernel source and repositories
      id: kernel
      run: |
        set -e
        WORKSPACE_FOLDER="${{ steps.workspace.outputs.workspace-folder }}"
        cd "$WORKSPACE_FOLDER"
        git clone --depth=1 ${{ github.event.inputs.KERNEL_TREE }} -b ${{ github.event.inputs.KERNEL_TREE_BRANCH }} kernel_tree
        echo "kernel-folder=$(pwd)/kernel_tree" >> $GITHUB_OUTPUT

        cd kernel_tree
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 ../susfs4ksu
        git clone https://github.com/TheWildJames/kernel_patches.git ../kernel_patches
        mkdir -p common/fs common/include/linux # Create directories upfront

    - name: Apply KernelSU and SUSFS patches
      run: |
        set -e
        KERNEL_FOLDER="${{ steps.kernel.outputs.kernel-folder }}"
        cd "$KERNEL_FOLDER" # Explicitly change to kernel root directory

        echo "Current working directory before patching:"
        pwd # Log current working directory

        # Apply KernelSU Next
        rm -rf KernelSU-Next
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs

        # Define patch paths (cleaner organization)
        KSU_SUSFS_PATCH_1="../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
        SUSFS_PATCH_2="../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
        HIDE_STUFF_PATCH="../kernel_patches/69_hide_stuff.patch"

        # --- Debugging around fs/Makefile patch ---
        echo "Listing fs/Makefile before patch:"
        ls -l fs/Makefile # Check if fs/Makefile exists

        cd common # Go into common directory for SUSFS patches
        echo "Current working directory before SUSFS patches:"
        pwd # Log current working directory

        patch -p1 -N < "$SUSFS_PATCH_2" # Try -p1 again for SUSFS patches
        patch -p1 -F 3 -N < "$HIDE_STUFF_PATCH"
        cd .. # Go back to kernel root after SUSFS patches! <---- IMPORTANT CHANGE

        cd KernelSU-Next
        patch -p1 -N < "$KSU_SUSFS_PATCH_1" # Apply directly, non-interactive, fail on error
        cd .. # Go back to kernel root


        sed -i '2s/check_defconfig//' ./common/build.config.gki # Corrected path to ./common/build.config.gki
        sed -i '/obj-$(CONFIG_KSU_SUSFS_SUS_SU) += sus_su.o/d' ./fs/Makefile # Keep this line

        # Add SUSFS configuration settings (using a block echo for clarity) - Keep this section
        cat >> ./common/arch/arm64/configs/gki_defconfig <<EOF
        CONFIG_KSU=y
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        EOF


    - name: Building kernel
      id: build
      run: |
        set -e
        KERNEL_FOLDER="${{ steps.kernel.outputs.kernel-folder }}"
        TOOLS_FOLDER="${{ steps.workspace.outputs.tools-folder }}"
        BUILD_START_TIME=$(date +%s)
        echo "Building kernel..."

        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="cabagekiller"
        export KBUILD_BUILD_HOST="Github"
        export PATH="$TOOLS_FOLDER/clang/bin:$PATH" # Set PATH here to ensure it's used in make commands

        mkdir -p artifacts # Create the artifacts directory
        make O=out ARCH=arm64 gale_defconfig V=1
        make O=out CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all) CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

        BUILD_END_TIME=$(date +%s)
        BUILD_ELAPSED_TIME=$((BUILD_END_TIME - BUILD_START_TIME))
        echo "elapsed_time=$BUILD_ELAPSED_TIME" >> $GITHUB_OUTPUT
        echo "Kernel build finished in $BUILD_ELAPSED_TIME seconds."

      working-directory: ${{ steps.kernel.outputs.kernel-folder }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: ${{ steps.kernel.outputs.kernel-folder }}/artifacts/

    - name: Handle AnyKernel3 zips
      run: |
        set -e
        KERNEL_FOLDER="${{ steps.kernel.outputs.kernel-folder }}"
        cd "$KERNEL_FOLDER/out/arch/arm64/boot/"

        # Function to handle AnyKernel creation (DRY principle)
        handle_anykernel() {
          local ak_url="$1"
          local ak_branch="$2"
          local ak_name_prefix="$3"
          local zip_output_var="$4"

          if [[ -n "$ak_url" ]]; then
            local ak_branch_final="${ak_branch:-${{ github.event.inputs.CODENAME }}}" # Default branch to codename if empty
            local ak_folder_name="${ak_name_prefix}AnyKernel"
            git clone --recursive --depth=1 "$ak_url" -b "$ak_branch_final" "$ak_folder_name"

            if [ -e "Image.gz" ]; then cp -f Image.gz "$ak_folder_name"; fi
            if [ -e "dtb.img" ]; then mv -f dtb.img dtb; cp -f dtb "$ak_folder_name/dtb"; fi
            if [ -e "dtbo.img" ]; then cp -f dtbo.img "$ak_folder_name"; fi

            local zip_name="${ak_name_prefix}-KSUNEXT-SUSFS-${{ github.event.inputs.CODENAME }}.zip"
            cd "$ak_folder_name"
            zip -q -r "../$zip_name" *
            cd ..
            echo "$zip_output_var=$zip_name" >> $GITHUB_OUTPUT
            echo "Created $zip_name"
          else
            echo "Skipping $ak_name_prefix AnyKernel (URL not provided)."
          fi
        }

        handle_anykernel "${{ github.event.inputs.ANYKERNEL_URL }}" "${{ github.event.inputs.ANYKERNEL_BRANCH }}" "N0kernel-AOSP" "anykernel_zipname"
        handle_anykernel "${{ github.event.inputs.SECOND_ANYKERNEL_URL }}" "${{ github.event.inputs.SECOND_ANYKERNEL_BRANCH }}" "N0kernel-HYPEROS" "second_anykernel_zipname"

    - name: Upload to Release
      if: ${{ github.event.inputs.UPLOAD_TO_RELEASE == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.kernel.outputs.kernel-folder }}/out/arch/arm64/boot/${{ steps.anykernel.outputs.anykernel_zipname }}
          ${{ steps.kernel.outputs.kernel-folder }}/out/arch/arm64/boot/${{ steps.second_anykernel.outputs.second_anykernel_zipname }}
        name: ${{ github.event.inputs.CODENAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          <b>${{ steps.workspace.outputs.build_title }}</b>
          <b>Kernel successfully built!</b>, took ${{ steps.build.outputs.elapsed_time }} seconds.

          <b>Kernel tree</b>: ${{ github.event.inputs.KERNEL_TREE }}/tree/${{ github.event.inputs.KERNEL_TREE_BRANCH }}
          <b>Action</b>: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Kernel Artifacts (if not releasing)
      if: ${{ github.event.inputs.UPLOAD_TO_RELEASE != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Artifacts
        path: |
          ${{ steps.kernel.outputs.kernel-folder }}/out/arch/arm64/boot/Image.gz
          ${{ steps.kernel.outputs.kernel-folder }}/out/arch/arm64/boot/dtb
          ${{ steps.kernel.outputs.kernel-folder }}/out/arch/arm64/boot/dtbo.img

    - name: Upload AnyKernel Artifacts (if not releasing and URLs provided)
      if: ${{ github.event.inputs.UPLOAD_TO_RELEASE != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel-Artifacts
        path: |
          ${{ steps.kernel.outputs.kernel-folder }}/out/arch/arm64/boot/*AnyKernel*/
          !${{ steps.kernel.outputs.kernel-folder }}/out/arch/arm64/boot/*AnyKernel*/.git
          !${{ steps.kernel.outputs.kernel-folder }}/out/arch/arm64/boot
